name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-package:
    name: Update and package
    runs-on: ubuntu-latest
    permissions:
      contents: write # Commit refreshed source data.
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Run updater unit tests
        run: python3 -m unittest tests/test_update_models.py -v

      - name: Refresh source data
        if: github.event_name != 'push'
        run: python3 scripts/update_models.py

      - name: Commit changed source data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/models.json important-changes.xml index.html; then
            echo "No source data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models.json important-changes.xml index.html
          git commit -m "Update model pricing and coding rankings"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: update-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write # Publish the Pages artifact.
      id-token: write # Authenticate the Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
