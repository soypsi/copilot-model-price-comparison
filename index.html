<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilot Model Price Comparison</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --bg: #0f1115;
      --fg: #f0f3f7;
      --muted: #a9b2bd;
      --line: #2b3138;
      --accent: #6ea8fe;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --muted: #4d5865;
        --line: #d7dce2;
        --accent: #0057d9;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      height: 100%;
    }

    .wrap {
      box-sizing: border-box;
      height: 100vh;
      padding: 10px;
      display: grid;
      grid-template-rows: repeat(5, auto) minmax(0, 1fr) auto;
      gap: 8px;
    }

    .title {
      font-size: 14px;
      margin: 0;
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .compare-button {
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      padding: 4px 8px;
    }

    .compare-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 4px 6px;
      text-align: left;
    }

    thead tr.filters th {
      top: 27px;
      z-index: 1;
      padding: 2px 4px 4px;
    }

    tbody td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 3px 6px;
    }

    th:last-child, td:last-child {
      border-right: 0;
    }

    .sort {
      cursor: pointer;
      user-select: none;
      color: inherit;
      border: 0;
      background: transparent;
      font: inherit;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sort.active {
      color: var(--accent);
      font-weight: 600;
    }

    .filter {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 4px;
      min-width: 90px;
    }

    .filter-wrap {
      position: relative;
    }

    .filter-wrap.active {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .filter {
      padding-right: 20px;
    }

    .filter.active {
      border-color: var(--accent);
      font-weight: 600;
    }

    .filter-clear {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      border: 0;
      padding: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: inherit;
      line-height: 1;
    }

    .filter-clear.active {
      color: var(--accent);
      font-weight: 700;
    }

    .filter-clear:disabled {
      visibility: hidden;
    }

    .numeric-column {
      text-align: right;
    }

    .numeric-column .sort {
      width: 100%;
      justify-content: flex-end;
    }

    .numeric-column .filter {
      text-align: right;
    }

    .price-cell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 1em;
      gap: 8px;
      align-items: center;
    }

    .price-offset {
      opacity: 0.55;
      text-align: left;
    }

    .price-value {
      text-align: right;
    }

    .price-number {
      display: inline-grid;
      grid-template-columns: 4ch auto 3ch;
      font-variant-numeric: tabular-nums;
    }

    .price-whole {
      text-align: right;
    }

    .price-fraction {
      text-align: left;
    }

    .price-trend {
      font-weight: 700;
      text-align: center;
    }

    .price-trend-up {
      color: #f85149;
    }

    .price-trend-down {
      color: #3fb950;
    }

    .rank-cell {
      display: inline-grid;
      grid-template-columns: 4ch 1em;
      gap: 4px;
      align-items: center;
    }

    .rank-value {
      text-align: right;
    }

    .rank-trend {
      font-weight: 700;
      text-align: center;
    }

    .rank-trend-up {
      color: #3fb950;
    }

    .rank-trend-down {
      color: #f85149;
    }

    .changelog {
      max-height: 25vh;
      overflow: auto;
      border-top: 1px solid var(--line);
      padding: 8px 2px 0;
      font-size: 12px;
    }

    .changelog h2 {
      font-size: 13px;
      margin: 0 0 4px;
    }

    .changelog h2 a {
      margin-left: 4px;
      text-decoration: none;
    }

    .changelog ul {
      margin: 0;
      padding-left: 18px;
    }

    .changelog li + li {
      margin-top: 3px;
    }

    .error {
      color: #ff6b6b;
      font-size: 13px;
    }

    .hidden-notice {
      position: relative;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: color-mix(in srgb, var(--accent) 12%, var(--bg));
      color: var(--fg);
      font-size: 12px;
      padding: 7px 9px;
      cursor: help;
    }

    .hidden-models {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 3;
      box-sizing: border-box;
      width: min(420px, calc(100vw - 40px));
      max-height: min(240px, 35vh);
      overflow: auto;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      box-shadow: 0 4px 14px rgb(0 0 0 / 35%);
      cursor: default;
    }

    .hidden-notice:hover .hidden-models,
    .hidden-notice:focus .hidden-models {
      display: block;
    }

    .hidden-models-title {
      display: block;
      margin-bottom: 4px;
    }

    .hidden-models-list {
      margin: 0;
      padding-left: 18px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">
      <span>Copilot model price comparison</span>
      <span id="row-count" class="meta">Loading…</span>
    </h1>
    <div id="source" class="meta"></div>
    <div id="updated" class="meta"></div>
    <div class="actions">
      <button id="compare-button" class="compare-button" type="button" disabled>
        Compare selected models
      </button>
      <span id="selection-count" class="meta">Select two models</span>
    </div>
    <div id="hidden-notice" class="hidden-notice" role="status" tabindex="0" hidden></div>
    <div class="table-wrap">
      <table id="pricing-table" aria-label="Model pricing table"></table>
    </div>
    <section id="changelog" class="changelog" aria-labelledby="changelog-title" hidden></section>
  </div>

  <script>
    const state = {
      columns: [],
      rows: [],
      sortColumn: "Total price",
      sortDirection: "asc",
      filters: {
        "Coding rank": "!empty",
      },
      selectedModels: new Set(),
    };

    const table = document.getElementById("pricing-table");
    const rowCount = document.getElementById("row-count");
    const sourceEl = document.getElementById("source");
    const updatedEl = document.getElementById("updated");
    const changelogEl = document.getElementById("changelog");
    const hiddenNotice = document.getElementById("hidden-notice");
    const compareButton = document.getElementById("compare-button");
    const selectionCount = document.getElementById("selection-count");
    const priceColumns = new Set(["Input", "Cached input", "Cache write", "Output", "Total price"]);
    const numericColumns = new Set(["Threshold (input tokens)", ...priceColumns, "Coding rank"]);

    function cellValue(value) {
      const text = String(value || "").trim();
      return /^not applicable$/i.test(text) ? "" : text;
    }

    function toThresholdTuple(value) {
      const text = (value || "").trim();
      if (!text || /not applicable/i.test(text)) return [3, Number.POSITIVE_INFINITY];
      const match = text.match(/^(<=|>=|<|>|≤|≥)?\s*([0-9]+(?:\.[0-9]+)?)\s*([KMB])?/i);
      if (!match) return [4, Number.POSITIVE_INFINITY];
      const op = match[1] || "=";
      const num = Number.parseFloat(match[2]);
      const unit = (match[3] || "").toUpperCase();
      const mult = unit === "K" ? 1_000 : unit === "M" ? 1_000_000 : unit === "B" ? 1_000_000_000 : 1;
      const rank = op === "<=" || op === "≤" || op === "<" ? 0 : op === "=" ? 1 : 2;
      return [rank, num * mult];
    }

    function toComparable(column, value) {
      const text = cellValue(value);

      if (column.toLowerCase().includes("threshold")) {
        if (!text) return { kind: "text", value: "" };
        return { kind: "threshold", value: toThresholdTuple(text) };
      }

      const numericValues = state.rows
        .map((row) => cellValue(row[column]))
        .filter(Boolean);
      const numericColumn = numericValues.length > 0 && numericValues.every((item) =>
        /^\$?\s*[0-9]+(?:\.[0-9]+)?$/.test(item)
      );
      if (numericColumn) {
        return {
          kind: "number",
          value: text ? Number.parseFloat(text.replace("$", "").trim()) : Number.NEGATIVE_INFINITY,
        };
      }

      return { kind: "text", value: text.toLowerCase() };
    }

    function compareRows(a, b) {
      const col = state.sortColumn;
      const dir = state.sortDirection === "asc" ? 1 : -1;
      const av = toComparable(col, a[col]);
      const bv = toComparable(col, b[col]);

      if (av.kind === "threshold" && bv.kind === "threshold") {
        if (av.value[0] !== bv.value[0]) return (av.value[0] - bv.value[0]) * dir;
        if (av.value[1] !== bv.value[1]) return (av.value[1] - bv.value[1]) * dir;
      } else if (av.kind === "number" && bv.kind === "number" && av.value !== bv.value) {
        return (av.value - bv.value) * dir;
      } else if (String(av.value) !== String(bv.value)) {
        return (String(av.value) < String(bv.value) ? -1 : 1) * dir;
      }

      for (const fallback of ["Provider", "Model", "Tier", "Threshold (input tokens)"]) {
        const left = String(a[fallback] || "").toLowerCase();
        const right = String(b[fallback] || "").toLowerCase();
        if (left !== right) return left < right ? -1 : 1;
      }
      return 0;
    }

    function filterMatches(column, row) {
      const filter = (state.filters[column] || "").trim().toLowerCase();
      if (!filter) return true;
      const value = cellValue(row[column]);
      if (filter === "!empty") return value !== "";
      const numericFilter = parseNumericFilter(filter);
      if (numericFilter) {
        const comparable = toComparable(column, row[column]);
        if (comparable.kind !== "number") return false;
        if (numericFilter.operator === ">") return comparable.value > numericFilter.number;
        if (numericFilter.operator === ">=") return comparable.value >= numericFilter.number;
        if (numericFilter.operator === "<") return comparable.value < numericFilter.number;
        if (numericFilter.operator === "<=") return comparable.value <= numericFilter.number;
        return comparable.value === numericFilter.number;
      }
      return value.toLowerCase().includes(filter);
    }

    function hiddenReasons(row) {
      const reasons = [];
      if (state.selectedModels.size === 2 && !state.selectedModels.has(modelIdFor(row))) {
        reasons.push("two-model comparison");
      }
      for (const column of state.columns) {
        const filter = (state.filters[column] || "").trim();
        if (filter && !filterMatches(column, row)) {
          reasons.push(`${column}: ${filter}`);
        }
      }
      return reasons;
    }

    function hiddenRows() {
      return state.rows
        .map((row) => ({ row, reasons: hiddenReasons(row) }))
        .filter(({ reasons }) => reasons.length > 0);
    }

    function filteredRows() {
      return state.rows.filter((row) => hiddenReasons(row).length === 0);
    }

    function updateHiddenNotice(hidden) {
      if (!hidden.length) {
        hiddenNotice.hidden = true;
        hiddenNotice.textContent = "";
        return;
      }

      const reasonCounts = new Map();
      for (const { reasons } of hidden) {
        for (const reason of reasons) {
          reasonCounts.set(reason, (reasonCounts.get(reason) || 0) + 1);
        }
      }
      const reasons = Array.from(reasonCounts, ([reason, count]) => `${reason} (${count})`).join(", ");
      const models = hidden.map(({ row }) => {
        const tier = row.Tier ? `, ${row.Tier}` : "";
        const threshold = row["Threshold (input tokens)"]
          ? `, ${row["Threshold (input tokens)"]}`
          : "";
        return `${row.Provider}: ${row.Model}${tier}${threshold}`;
      });
      hiddenNotice.hidden = false;
      const modelItems = models.map((model) => `<li>${escapeHtml(model)}</li>`).join("");
      hiddenNotice.innerHTML = `
        <strong>${hidden.length} model${hidden.length === 1 ? "" : "s"} hidden</strong>
        by ${escapeHtml(reasons)}. Hover or focus to list hidden models.
        <span class="hidden-models" role="tooltip">
          <strong class="hidden-models-title">Hidden models</strong>
          <ul class="hidden-models-list">${modelItems}</ul>
        </span>
      `;
    }

    function parseNumericFilter(value) {
      const match = value.match(/^(<=|>=|<|>|=)\s*\$?\s*(-?\d+(?:\.\d+)?)$/);
      if (!match) return null;
      return {
        operator: match[1],
        number: Number.parseFloat(match[2]),
      };
    }

    function priceValue(value) {
      const text = cellValue(value);
      if (!text) return null;
      const number = Number.parseFloat(text.replace("$", "").trim());
      return Number.isFinite(number) ? number : null;
    }

    function priceOffset(rows, rowIndex, column) {
      const current = priceValue(rows[rowIndex][column]);
      if (current === null) return "";

      if (column === "Total price" && state.selectedModels.size === 1) {
        const selected = state.rows.find((row) => state.selectedModels.has(modelIdFor(row)));
        const baseline = selected ? priceValue(selected[column]) : null;
        if (baseline === null || baseline === 0) return "";
        const offset = ((current - baseline) / baseline) * 100;
        return `${offset >= 0 ? "+" : ""}${offset.toFixed(1)}%`;
      }

      for (let index = rowIndex - 1; index >= 0; index -= 1) {
        const previous = priceValue(rows[index][column]);
        if (previous === null) continue;
        if (previous === 0) return "";
        const offset = ((current - previous) / previous) * 100;
        return `${offset >= 0 ? "+" : ""}${offset.toFixed(1)}%`;
      }
      return "";
    }

    function priceValueMarkup(value) {
      const match = value.match(/^(\d+)(?:\.(\d+))?$/);
      if (!match) return escapeHtml(value);
      const fraction = (match[2] || "").padEnd(3, "0").slice(0, 3);
      return `<span class="price-number"><span class="price-whole">${match[1]}</span><span>.</span><span class="price-fraction">${fraction}</span></span>`;
    }

    function priceTrend(row, column) {
      const diff = row._price_diffs?.[column];
      if (typeof diff !== "number" || diff === 0) return "";
      const formatted = `${diff > 0 ? "+" : "-"}$${Math.abs(diff).toFixed(3).replace(/\.?0+$/, "")}`;
      const direction = diff > 0 ? "up" : "down";
      const arrow = diff > 0 ? "↑" : "↓";
      return `<span class="price-trend price-trend-${direction}" title="Price change: ${formatted}">${arrow}</span>`;
    }

    function renderChangelog(changelog) {
      if (!Array.isArray(changelog) || !changelog.length) return;
      changelogEl.innerHTML = `<h2 id="changelog-title">Important changes <a href="important-changes.xml" target="_blank" rel="noopener noreferrer" aria-label="Subscribe to important changes RSS feed">📡</a></h2><ul>${changelog
        .slice().reverse()
        .map((entry) => `<li><strong>${escapeHtml(String(entry.updated_at).slice(0, 10))}</strong>: ${entry.changes.map(escapeHtml).join(" ")}</li>`)
        .join("")}</ul>`;
      changelogEl.hidden = false;
    }

    function renderTable() {
      const rows = filteredRows().sort(compareRows);
      updateHiddenNotice(hiddenRows());
      rowCount.textContent = `${rows.length} / ${state.rows.length} rows`;

      const headerCells = [
        "<th aria-label=\"Select\"></th>",
        ...state.columns.map((column) => {
        const active = state.sortColumn === column ? "active" : "";
        const arrow = state.sortColumn === column ? (state.sortDirection === "asc" ? "▲" : "▼") : "";
        const numeric = numericColumns.has(column) ? " numeric-column" : "";
        const currencyNote = priceColumns.has(column) ? " title=\"Prices in USD\"" : "";
        return `<th class="${numeric.trim()}"${currencyNote}><button class="sort ${active}" data-col="${column}">${column} ${arrow}</button></th>`;
        }),
      ].join("");

      const filterCells = [
        "<th></th>",
        ...state.columns.map((column) => {
        const value = state.filters[column] || "";
        const escapedValue = value.replace(/\"/g, "&quot;");
        const disabled = value ? "" : " disabled";
        const active = value.trim() ? " active" : "";
        const numeric = numericColumns.has(column) ? " numeric-column" : "";
        return `<th class="${numeric.trim()}"><div class="filter-wrap${active}"><input class="filter${active}" data-col="${column}" value="${escapedValue}" placeholder="filter" title="Filter by text, numeric comparisons like &lt;10 or &gt;=5, or !empty to exclude empty values" aria-label="Filter ${column}: text, numeric comparisons like less than 10, or !empty to exclude empty values"><button class="filter-clear${active}" type="button" data-col="${column}" aria-label="Clear ${column} filter"${disabled}>×</button></div></th>`;
        }),
      ].join("");

      const bodyRows = rows.map((row) => {
        const modelId = modelIdFor(row);
        const checked = state.selectedModels.has(modelId) ? " checked" : "";
        const cells = [
          `<td><input class="model-select" type="checkbox" data-model-id="${escapeHtml(modelId)}"${checked} aria-label="Select ${escapeHtml(row.Model)}"></td>`,
          ...state.columns.map((column) => {
            const val = cellValue(row[column]);
            const displayVal = priceColumns.has(column) ? val.replace(/^\$\s*/, "") : val;
            const numeric = numericColumns.has(column) ? " numeric-column" : "";
            const showOffset = priceColumns.has(column) && (
              state.sortColumn === column
              || (state.sortColumn === "Coding rank" && column === "Total price")
              || (state.selectedModels.size === 1 && column === "Total price")
            );
            const offset = showOffset ? priceOffset(rows, rows.indexOf(row), column) : "";
            if (column === "Model") {
              const url = `https://benchlm.ai/models/${slugify(val)}`;
              return `<td><a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(val)}</a></td>`;
            }
            if (column === "Coding rank" && row._coding_model) {
              const scores = Object.entries(row._category_scores || {})
                .map(([name, score]) => `${name}: ${score ?? "n/a"}`)
                .join(" | ");
              const label = `#${val} ${row._coding_model} — ${scores}`;
              const rankDiff = Number.isInteger(row._coding_rank_diff) ? row._coding_rank_diff : null;
              const trend = rankDiff === null || rankDiff === 0 ? "" : (
                rankDiff < 0
                  ? `<span class="rank-trend rank-trend-up" title="Rank change: ${rankDiff}">↑</span>`
                  : `<span class="rank-trend rank-trend-down" title="Rank change: +${rankDiff}">↓</span>`
              );
              return `<td class="${numeric.trim()}" title="${escapeHtml(label)}"><span class="rank-cell"><span class="rank-value">${escapeHtml(displayVal)}</span>${trend}</span></td>`;
            }
            if (priceColumns.has(column) && offset) {
              return `<td class="${numeric.trim()}"><div class="price-cell"><span class="price-offset">${offset}</span><span class="price-value">${priceValueMarkup(displayVal)}</span>${priceTrend(row, column)}</div></td>`;
            }
            if (priceColumns.has(column)) {
              return `<td class="${numeric.trim()}"><div class="price-cell"><span class="price-offset"></span><span class="price-value">${priceValueMarkup(displayVal)}</span>${priceTrend(row, column)}</div></td>`;
            }
            return `<td class="${numeric.trim()}">${escapeHtml(displayVal)}</td>`;
          }),
        ].join("");
        return `<tr>${cells}</tr>`;
      }).join("");

      table.innerHTML = `
        <thead>
          <tr>${headerCells}</tr>
          <tr class="filters">${filterCells}</tr>
        </thead>
        <tbody>${bodyRows}</tbody>
      `;

      table.querySelectorAll("button.sort").forEach((el) => {
        el.addEventListener("click", () => {
          const col = el.getAttribute("data-col");
          if (state.sortColumn === col) {
            state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
          } else {
            state.sortColumn = col;
            state.sortDirection = "asc";
          }
          renderTable();
        });
      });

      table.querySelectorAll("input.filter").forEach((el) => {
        el.addEventListener("input", () => {
          const col = el.getAttribute("data-col");
          const selectionStart = el.selectionStart;
          const selectionEnd = el.selectionEnd;
          state.filters[col] = el.value;
          renderTable();
          const replacement = Array.from(table.querySelectorAll("input.filter"))
            .find((input) => input.getAttribute("data-col") === col);
          if (replacement) {
            replacement.focus();
            replacement.setSelectionRange(selectionStart, selectionEnd);
          }
        });
      });

      table.querySelectorAll("button.filter-clear").forEach((el) => {
        el.addEventListener("click", () => {
          const col = el.getAttribute("data-col");
          state.filters[col] = "";
          renderTable();
          const replacement = Array.from(table.querySelectorAll("input.filter"))
            .find((input) => input.getAttribute("data-col") === col);
          replacement?.focus();
        });
      });

      table.querySelectorAll("input.model-select").forEach((el) => {
        el.addEventListener("change", () => {
          const modelId = el.getAttribute("data-model-id");
          if (el.checked) {
            if (state.selectedModels.size >= 2) {
              el.checked = false;
              return;
            }
            state.selectedModels.add(modelId);
          } else {
            state.selectedModels.delete(modelId);
          }
          renderTable();
        });
      });
      updateCompareControls();
    }

    function modelIdFor(row) {
      return `${row.Provider}::${row.Model}::${row.Tier || ""}::${row["Threshold (input tokens)"] || ""}`;
    }

    function slugify(value) {
      return value
        .normalize("NFKD")
        .replace(/\./g, "-")
        .replace(/[^\w\s-]/g, "")
        .trim()
        .toLowerCase()
        .replace(/[\s_]+/g, "-")
        .replace(/-+/g, "-");
    }

    function updateCompareControls() {
      const count = state.selectedModels.size;
      selectionCount.textContent = count === 2 ? "Ready to compare" : `Select ${2 - count} more model${count === 1 ? "" : "s"}`;
      compareButton.disabled = count !== 2;
    }

    compareButton.addEventListener("click", () => {
      const selected = state.rows.filter((row) => state.selectedModels.has(modelIdFor(row)));
      if (selected.length !== 2) return;
      const [first, second] = selected;
      const url = `https://benchlm.ai/compare/${slugify(first.Model)}-vs-${slugify(second.Model)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    });

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;");
    }

    function fail(message) {
      rowCount.textContent = "";
      table.outerHTML = `<p class="error">${escapeHtml(message)}</p>`;
    }

    async function init() {
      try {
        const response = await fetch("data/models.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        state.columns = data.columns || [];
        state.rows = data.rows || [];
        if (!state.columns.length) throw new Error("No columns in data file.");
        sourceEl.innerHTML = `Source: <a href="${data.source_url}" target="_blank" rel="noreferrer">${data.source_url}</a>`;
        updatedEl.textContent = data.updated_at ? `Updated: ${data.updated_at}` : "";
        renderChangelog(data.changelog);
        renderTable();
      } catch (error) {
        fail(`Failed to load data/models.json: ${error instanceof Error ? error.message : String(error)}`);
      }
    }

    init();
  </script>
</body>
</html>
